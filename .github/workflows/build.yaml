name: Build and Upload to Lambda

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27.0'

    - name: Sync dreamingway-bot Discord commands
      run: |
        go run . --config-string '${{ secrets.DREAMINGWAY_DISCORD_CONFIG }}'

    # - name: Sync lplaziv-bot Discord commands
    #   run: |
    #     go run . --config-string '${{ secrets.LPLAZIV_DISCORD_CONFIG }}'

    - name: Build endpoint binary for Lambda
      run: |
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags lambda.norpc -o bootstrap ./cmd/endpoint/
        zip endpoint.zip bootstrap

    - name: Build task binary for Lambda
      run: |
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags lambda.norpc -o bootstrap ./cmd/task/
        zip task.zip bootstrap

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Upload dreamingway-bot endpoint binary to S3 and Lambda
      run: |
        aws s3 cp endpoint.zip \
          s3://${{ secrets.AWS_S3_BUCKET }}/lambda/dreamingway-bot/endpoint/bootstrap.zip
        aws lambda update-function-code \
          --function-name ${{ vars.DREAMINGWAY_AWS_LAMBDA_ENDPOINT_FUNCTION_NAME }} \
          --s3-bucket ${{ secrets.AWS_S3_BUCKET }} \
          --s3-key lambda/dreamingway-bot/endpoint/bootstrap.zip \
          --query '[FunctionName,LastUpdateStatus]' \
          --output text

    # - name: Upload lplaziv-bot endpoint binary to S3 and Lambda
    #   run: |
    #     aws s3 cp endpoint.zip \
    #       s3://${{ secrets.AWS_S3_BUCKET }}/lambda/lplaziv-bot/endpoint/bootstrap.zip
    #     aws lambda update-function-code \
    #       --function-name ${{ vars.LPLAZIV_AWS_LAMBDA_ENDPOINT_FUNCTION_NAME }} \
    #       --s3-bucket ${{ secrets.AWS_S3_BUCKET }} \
    #       --s3-key lambda/lplaziv-bot/endpoint/bootstrap.zip \
    #       --query '[FunctionName,LastUpdateStatus]' \
    #       --output text

    - name: Upload dreamingway-bot task binary to S3 and Lambda
      run: |
        aws s3 cp task.zip \
          s3://${{ secrets.AWS_S3_BUCKET }}/lambda/dreamingway-bot/task/bootstrap.zip
        aws lambda update-function-code \
          --function-name ${{ vars.DREAMINGWAY_AWS_LAMBDA_TASK_FUNCTION_NAME }} \
          --s3-bucket ${{ secrets.AWS_S3_BUCKET }} \
          --s3-key lambda/dreamingway-bot/task/bootstrap.zip \
          --query '[FunctionName,LastUpdateStatus]' \
          --output text

    # - name: Upload lplaziv-bot task binary to S3 and Lambda
    #   run: |
    #     aws s3 cp task.zip \
    #       s3://${{ secrets.AWS_S3_BUCKET }}/lambda/lplaziv-bot/task/bootstrap.zip
    #     aws lambda update-function-code \
    #       --function-name ${{ vars.LPLAZIV_AWS_LAMBDA_TASK_FUNCTION_NAME }} \
    #       --s3-bucket ${{ secrets.AWS_S3_BUCKET }} \
    #       --s3-key lambda/lplaziv-bot/task/bootstrap.zip \
